<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Panels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container { display: flex; width: 90%; gap: 15px; }

        .panel {
            position: relative;
            border-radius: 20px;
            height: 90vh;
            flex: 0.5;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: flex 0.7s ease;
            cursor: pointer;
        }

        .panel .img-text {
            position: absolute;
            color: white;
            bottom: 10px;
            left: 10px;
        }

        .panel.active { flex: 5; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Each panel has a unique id -->
        <div id="panel-1" class="panel active" style="background-image: url(https://images.unsplash.com/photo-1558979158-65a1eaa08691?auto=format&fit=crop&w=1350&q=80);">
            <h3 class="img-text">Explore the world</h3>
        </div>
        <div id="panel-2" class="panel" style="background-image: url(https://images.unsplash.com/photo-1572276596237-5db2c3e16c5d?auto=format&fit=crop&w=1350&q=80);">
            <h3 class="img-text">Wild Forest</h3>
        </div>
        <div id="panel-3" class="panel" style="background-image: url(https://images.unsplash.com/photo-1551009175-8a68da93d5f9?auto=format&fit=crop&w=1351&q=80);">
            <h3 class="img-text">City on Winter</h3>
        </div>
        <div id="panel-4" class="panel" style="background-image: url(https://images.unsplash.com/photo-1551009175-8a68da93d5f9?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1351&q=80);">
            <h3 class="img-text">Mountain Cloud</h3>
        </div>
        <div id="panel-5" class="panel" style="background-image: url(https://images.unsplash.com/photo-1549880338-65ddcdfd017b?auto=format&fit=crop&w=1350&q=80);">
            <h3 class="img-text">Sunny Beach</h3>
        </div>
    </div>

    <script>
        const panels = document.querySelectorAll(".panel");

        panels.forEach(panel => {
            panel.addEventListener("click", () => {
                // Collapse all panels, then expand the clicked one
                panels.forEach(p => p.classList.remove("active"));
                panel.classList.add("active");
            });
        });
    </script>
</body>
</html>
